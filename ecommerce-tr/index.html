<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketSepeti – Yönlendiriliyor…</title>
  <!-- Anında yönlendirme -->
  <meta http-equiv="refresh" content="0; url=./ecommerce-tr/" />
  <link rel="canonical" href="./ecommerce-tr/" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 2rem; font-weight: 900; letter-spacing: -1px; }
    .logo span { color: #ff6600; }
    .spinner {
      width: 46px; height: 46px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #ff6600;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.85; font-size: 0.95rem; }
    a { color: #ffd166; font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">Market<span>Sepeti</span></div>
  <div class="spinner"></div>
  <p>Mağazamıza yönlendiriliyorsunuz…</p>
  <p>Otomatik olarak yönlenmediyseniz <a href="./ecommerce-tr/">buraya tıklayın</a>.</p>
  <script>
    // Sorgu ve hash parametrelerini koruyarak yönlendir
    window.location.replace("./ecommerce-tr/" + window.location.search + window.location.hash);
  </script>
</body>
</html>
